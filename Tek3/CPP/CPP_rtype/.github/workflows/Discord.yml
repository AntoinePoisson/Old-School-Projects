# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    name: Builder
    # Steps represent a sequence of tasks that will be executed as part of the job
    runs-on: ubuntu-latest
    container: epitechcontent/epitest-docker 
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Send status to Discord
        uses: nebularg/actions-discord-webhook@v1
        with:
          webhook_url: https://discord.com/api/webhooks/XXXXXXXXXXXXXXXXXX/XXXXXXXX_DISCORD_WEBHOOK_TOKEN_REDACTED_XXXXXXXX
        if: failure()

      - name: Discord Commits
        uses: Sniddl/discord-commits@v1.2
        with:
          webhook: https://discord.com/api/webhooks/XXXXXXXXXXXXXXXXXX/XXXXXXXX_DISCORD_WEBHOOK_TOKEN_REDACTED_XXXXXXXX
          message: "Successful commit to **{{ github.context.payload.repository.owner.name }}/{{ github.context.payload.repository.name}}**.\nDiff: {{ github.context.payload.compare }}"
          embed: '{ "title": "{{ commit.title }}", "description": "{{ commit.description }}", "url": "{{ commit.url }}", "author": { "name": "{{ commit.author.name }} ({{ commit.author.username }})", "icon_url": "https://avatars.io/gravatar/{{ commit.author.email }}"} }'
