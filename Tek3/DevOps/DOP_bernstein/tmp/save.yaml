apiVersion: apps/v1
kind: Service
metadata:
  name: result
  namespace: default
spec:
  replicas: 2
  restartPolicy: Always
  containers:
    - name: result
      image: "epitechcontent/t-dop-600-result:k8s"
      resources:
        limits:
          memory: "128M"
      ports:
        - containerPort: 80
      env:
        - name: POSTGRES_HOST
        - name: POSTGRES_PORT
        - name: POSTGRES_DB
        - name: POSTGRES_USER
        - name: POSTGRES_PASSWORD

